# Publishes to npm when a GitHub Release is published.
# npmjs.com must list this workflow as a trusted publisher for tolmach.
# Do not set registry-url here: setup-node would write an empty auth token
# and npm would skip the trusted-publisher login.

name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with trusted publishing
        run: npm install -g npm@11

      - name: Check release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm test

      - run: npm publish --provenance --access public
