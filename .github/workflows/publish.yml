# Publishes to npm when a GitHub Release is published.
# npmjs.com must list this file as a trusted publisher that is allowed to npm publish.
# Provenance signing is not registry login. Login needs npm >= 11.5.1.

name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm test

      - name: Publish
        run: |
          npm install -g npm@^11.5.1
          hash -r
          echo "npm $(npm --version) at $(command -v npm)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error("npm " + process.argv[1] + " cannot use trusted publishing; need >= 11.5.1");
              process.exit(1);
            }
          ' "$(npm --version)"
          npm publish --access public
